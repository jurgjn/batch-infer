[project]
name = "batch-infer"
version = "26.0-dev"
requires-python = ">=3.13"
dependencies = [
    "af3io",
    "ipykernel",
    "ipywidgets",
    "pooled-ppi",
    "pytest",
    "scikit-learn",
    "snakemake==9.19.0",
    "snakemake-executor-plugin-cluster-generic",
]

[project.scripts]
batch-infer = "batch_infer.cli:cli"

[build-system]
requires = ["uv_build>=0.9.22,<0.11.0"]
build-backend = "uv_build"
