alphafold3:
  container: /cluster/home/jjaenes/shared/alphafold3/images/alphafold3_colabfold_5e1abce.sif
  # `model_dir` show all options for with
  #   ls -d1 /cluster/project/beltrao/shared/alphafold3/models-af3-any-model/*
  model_dir: /cluster/project/beltrao/shared/alphafold3/models-af3-any-model/boltz2
  msas:
    retries: 1
  predictions:
    singularity_args: ''
    run_alphafold_args: >-
      --model=boltz2
      --nodownload_weights
      --num_recycles=3
    runtime: 4h
    mem_mb: 16384
    disk_mb: 16384
    slurm_extra: '--gpus=a100_80gb:1'
