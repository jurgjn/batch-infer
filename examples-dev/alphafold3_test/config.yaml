alphafold3:
  container: /cluster/project/beltrao/shared/alphafold3/images/alphafold3_v3.0.4.sif
  test:
    runtime: 4h
    mem_mb: 16384
    disk_mb: 16384
    # https://docs.hpc.ethz.ch/batchsystem/slurm/#submitting-gpu-jobs
    slurm_extra: '--gpus=a100:1'
    #slurm_extra: '--gpus=a100_80gb:1'
    #slurm_extra: '--gpus=pro_6000:1'
    #slurm_extra: '--gpus=rtx_4090:1'

singularity:
  container_dir: /cluster/project/beltrao/shared/alphafold3/images/
  pull: docker://jurgjn/alphafold3:v3.0.4
