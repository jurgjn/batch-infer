
alphafold3:
  container: /cluster/project/beltrao/shared/alphafold3/images/alphafold3_v3.0.1.sif
  data_sources: >-
    --data_dir=/cluster/project/beltrao/jjaenes/25.06.03_batch-infer/results/alphafold3_yeast/alphafold3_msas
    --data_dir=/cluster/work/beltrao/jjaenes/25.04.02_batch-infer-projects/af3_human/alphafold3_msas
  msas:
    # https://snakemake.readthedocs.io/en/stable/snakefiles/rules.html#defining-retries-for-fallible-rules
    retries: 3
  predictions:
    singularity_args: ''
    run_alphafold_args: >-
      --norun_data_pipeline
      --num_recycles=3
    run_alphafold_wrapper: run_alphafold_shard_default.sh
    runtime: 1h
    mem_mb: 16384
    disk_mb: 16384
    slurm_extra: "'--gpus=1 --gres=gpumem%80g'"
